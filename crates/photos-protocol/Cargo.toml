[package]
name = "photos-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP client for %photos and %contacts catalogs on desk %locus"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", features = ["json", "cookies"] }
