[package]
name = "locus-desktop"
description = "Locus desktop shell (libcosmic): renders locus-core, performs its effects"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "locus"
path = "src/main.rs"

[dependencies]
cosmic = { workspace = true }
locus-core = { path = "../locus-core" }
locus-client = { path = "../locus-client" }
locus-effects = { path = "../locus-effects" }
tokio = { version = "1", features = ["rt", "time", "fs"] }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
mime_guess = "2"
time = { version = "0.3", features = ["local-offset"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
