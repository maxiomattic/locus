[package]
name = "locus-cli"
description = "`loc`: a command line over the new Locus store, operations, proposals and sync."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "loc"
path = "src/main.rs"

[dependencies]
locus-model = { path = "../locus-model" }
locus-store = { path = "../locus-store" }
locus-sync = { path = "../locus-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
