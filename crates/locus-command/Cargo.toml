[package]
name = "locus-command"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Named-function plane for Locus: household identity, OS approval, audit"

[dependencies]
dirs = "6"
locus-protocol = { path = "../locus-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "locus"
path = "src/bin/locus.rs"
