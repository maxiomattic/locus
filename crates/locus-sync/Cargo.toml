[package]
name = "locus-sync"
description = "Locus sync: each object's home server orders its operations; clients keep a partial copy and replay on top."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
locus-model = { path = "../locus-model" }
locus-store = { path = "../locus-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
