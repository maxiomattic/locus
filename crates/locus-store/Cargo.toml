[package]
name = "locus-store"
description = "The Locus store: one SQLite database per machine plus blobs on disk, with the operation layer on top."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
locus-model = { path = "../locus-model" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
